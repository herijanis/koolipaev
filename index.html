<!doctype html><html lang="et"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kool">
<link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#f3f5f8">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}</style>
<title>Minu Koolipäev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one column, one big "now" card on top, everything else quiet; tab bar fixed at the bottom for the thumb */
:root{
  --bg:#f3f5f8; --card:#ffffff; --fg:#141a24; --muted:#6b7585; --line:#e3e7ee;
  --accent:#2f5bea; --accent-soft:#e6ecfd; --done:#9aa3b2; --warn:#d9480f; --warn-soft:#fdece4;
  --font:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f131a; --card:#181e28; --fg:#eef1f6; --muted:#8b95a7; --line:#262e3b;
  --accent:#7d9bff; --accent-soft:#1f2a47; --done:#5b6475; --warn:#ff8a5c; --warn-soft:#3a2219; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f131a; --card:#181e28; --fg:#eef1f6; --muted:#8b95a7; --line:#262e3b;
  --accent:#7d9bff; --accent-soft:#1f2a47; --done:#5b6475; --warn:#ff8a5c; --warn-soft:#3a2219; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:20px calc(96px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:15px;margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.wk{font-size:13px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:99px;white-space:nowrap}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.stack{display:flex;flex-direction:column;gap:8px}
.tnum{font-variant-numeric:tabular-nums}

/* the hero card */
.now{background:var(--accent);color:#fff;border-radius:22px;padding:20px}
.now .k{font-size:13px;font-weight:600;opacity:.85}
.now .s{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px;line-height:1.1}
.now .r{font-size:17px;font-weight:600;opacity:.95}
.now .room{font-size:44px;font-weight:800;letter-spacing:-.03em;line-height:1}
.now .row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:14px}
.bar{height:6px;background:rgba(255,255,255,.28);border-radius:9px;margin-top:16px;overflow:hidden}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.calm{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px}
.calm .s{font-size:22px;font-weight:700;margin:2px 0}
.calm .k{color:var(--muted);font-size:14px}

/* lesson rows */
.lesson{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px}
.lesson .t{font-size:13px;color:var(--muted);line-height:1.35}
.lesson .t b{display:block;color:var(--fg);font-size:15px}
.lesson .n{font-weight:600;min-width:0}
.lesson .n small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.lesson .rm{font-weight:700;font-size:15px}
.lesson.past{opacity:.45}
.lesson.cur{outline:2px solid var(--accent)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:1px}
.note{background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px;border-radius:12px;padding:10px 14px}

/* week view */
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.days button{font:inherit;border:0;background:var(--card);color:var(--fg);border-radius:14px;padding:9px 0;cursor:pointer}
.days button span{display:block;font-size:12px;color:var(--muted)}
.days button b{font-size:17px}
.days button.on{background:var(--fg);color:var(--bg)}
.days button.on span{color:var(--bg);opacity:.7}
.days button.today:not(.on) b{color:var(--accent)}
.wnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.wnav button{font:inherit;font-size:22px;border:0;background:var(--card);color:var(--fg);width:42px;height:42px;border-radius:50%;cursor:pointer}
.wnav div{font-weight:700;text-align:center}
.wnav div small{display:block;color:var(--muted);font-weight:400;font-size:13px}

/* tasks */
.task{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:16px;padding:13px 14px}
.task .chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);background:none;cursor:pointer;margin-top:1px;display:grid;place-items:center;color:#fff;font-size:15px;padding:0}
.task.done .chk{background:var(--done);border-color:var(--done)}
.task .body{flex:1;min-width:0}
.task .what{font-weight:600;overflow-wrap:anywhere}
.task .meta{font-size:13px;color:var(--muted);margin-top:2px}
.task.done .what{text-decoration:line-through;color:var(--done)}
.task .del{border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 2px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-left:6px;vertical-align:2px}
.due-soon{color:var(--warn);font-weight:600}
.big-btn{width:100%;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:16px;padding:15px;background:var(--accent);color:#fff;cursor:pointer}
.empty{color:var(--muted);text-align:center;padding:28px 10px;line-height:1.5}
form.add{background:var(--card);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
form.add input,form.add select{font:inherit;font-size:16px;width:100%;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:10px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row2{display:flex;gap:8px}
.row2 button{flex:1}
.ghost{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:12px;cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin-top:-6px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs div{display:flex;width:100%;max-width:520px}
nav.tabs button{flex:1;font:inherit;font-size:12px;font-weight:600;border:0;background:none;color:var(--muted);padding:10px 0 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 8px);background:var(--warn);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .6s}}
</style>

</head><body><main id="app"></main>
<nav class="tabs"><div>
  <button id="tab-today" data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Täna</button>
  <button id="tab-week" data-tab="week"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Tunniplaan</button>
  <button id="tab-tasks" data-tab="tasks"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>Ülesanded<span class="badge" id="badge" hidden></span></button>
</div></nav>

<script>
const CAL = {"weeks": {"2026-08-31": "A", "2026-09-07": "B", "2026-09-14": "A", "2026-09-21": "B", "2026-09-28": "A", "2026-10-05": "B", "2026-10-12": "A", "2026-10-19": "B", "2026-10-26": "A", "2026-11-02": "A", "2026-11-09": "B", "2026-11-16": "A", "2026-11-23": "B", "2026-11-30": "A", "2026-12-07": "B", "2026-12-14": "A", "2026-12-21": "B", "2026-12-28": "A", "2027-01-04": "B", "2027-01-11": "A", "2027-01-18": "B", "2027-01-25": "A", "2027-02-01": "B", "2027-02-08": "A", "2027-02-15": "B", "2027-02-22": "A", "2027-03-01": "A", "2027-03-08": "B", "2027-03-15": "A", "2027-03-22": "B", "2027-03-29": "A", "2027-04-05": "B", "2027-04-12": "A", "2027-04-19": "A", "2027-04-26": "B", "2027-05-03": "A", "2027-05-10": "B", "2027-05-17": "A", "2027-05-24": "B", "2027-05-31": "A", "2027-06-07": "B", "2027-06-14": "A"}, "off": {"2026-10-26": "Koolivaheaeg", "2026-10-27": "Koolivaheaeg", "2026-10-28": "Koolivaheaeg", "2026-10-29": "Koolivaheaeg", "2026-10-30": "Koolivaheaeg", "2026-12-18": "Jõulukontsert", "2026-12-21": "Koolivaheaeg", "2026-12-22": "Koolivaheaeg", "2026-12-23": "Koolivaheaeg", "2026-12-24": "Koolivaheaeg", "2026-12-25": "Koolivaheaeg", "2026-12-28": "Koolivaheaeg", "2026-12-29": "Koolivaheaeg", "2026-12-30": "Koolivaheaeg", "2026-12-31": "Koolivaheaeg", "2027-01-01": "Koolivaheaeg", "2027-02-22": "Koolivaheaeg", "2027-02-23": "Koolivaheaeg", "2027-02-24": "Koolivaheaeg", "2027-02-25": "Koolivaheaeg", "2027-02-26": "Koolivaheaeg", "2027-03-26": "Vaba päev", "2027-04-12": "Koolivaheaeg", "2027-04-13": "Koolivaheaeg", "2027-04-14": "Koolivaheaeg", "2027-04-15": "Koolivaheaeg", "2027-04-16": "Koolivaheaeg", "2027-06-09": "Koolivaheaeg", "2027-06-10": "Koolivaheaeg", "2027-06-11": "Koolivaheaeg", "2027-06-14": "Koolivaheaeg", "2027-06-15": "Koolivaheaeg", "2027-06-16": "Koolivaheaeg", "2027-06-17": "Koolivaheaeg", "2027-06-18": "Koolivaheaeg"}, "notes": {"2026-09-15": "Loeng edasiõppimisvõimalustest", "2026-09-29": "Lapsevanemate üldkoosolek kell 18.00", "2026-10-05": "Õpetajate päev", "2026-10-15": "Iseõppepäev", "2026-11-23": "Iseõppepäev", "2027-01-11": "Iseõppepäev", "2027-02-10": "Iseõppepäev", "2027-03-25": "Iseõppepäev", "2027-05-05": "Iseõppepäev"}};
const BELLS = {1:["09:00","10:20"],2:["10:30","11:50"],3:["12:35","13:55"],4:["14:05","15:25"]};
// [day 0=Mon, period, week ""=every/"A"/"B", subject, teacher, room]
const TT = [
 [0,1,"A","Klassijuhataja tund","Kivi","C311"],[0,1,"B","Keemia","Pilter","C222"],[0,2,"","Matemaatika","Kiis","C115"],[0,3,"A","Muusika","Kalvet","B217"],[0,4,"A","Käsitöö","Nahkur","C104"],
 [1,1,"","Eesti keel","Pappel","C241"],[1,2,"","Matemaatika","Kiis","C302"],[1,3,"B","Inglise keel","Kobi","C131"],
 [2,1,"A","Keemia","Pilter","C222"],[2,1,"B","Matemaatika","Kiis","C302"],[2,2,"","Kirjandus","Pappel","C241"],[2,3,"","Bioloogia","Heinsalu","C214"],[2,4,"","Inglise keel","Kobi","C131"],
 [3,1,"A","Eesti keel","Pappel","C241"],[3,2,"","Geograafia","Ojassalu","C204"],[3,3,"","Kehaline","Rünne","D0"],[3,4,"","Vene keel","Reimann","C119"],
 [4,1,"","Ühiskonnaõpetus","Vaarend","C223"],[4,2,"","Ajalugu","Kapsi","C229"],[4,3,"","Füüsika","Luus","C210"],[4,4,"A","Vene keel","Reimann","C119"]
];
const COLORS = {"Matemaatika":"#2f5bea","Eesti keel":"#e8590c","Kirjandus":"#f08c00","Inglise keel":"#0ca678","Vene keel":"#c2255c","Keemia":"#7048e8","Füüsika":"#1c7ed6","Bioloogia":"#37b24d","Geograafia":"#0b7285","Ajalugu":"#a0522d","Ühiskonnaõpetus":"#868e96","Muusika":"#d6336c","Käsitöö":"#e67700","Kehaline":"#f59f00","Klassijuhataja tund":"#5c7cfa"};
const SUBJECTS = [...new Set(TT.map(l=>l[3]))].filter(s=>s!=="Klassijuhataja tund").sort((a,b)=>a.localeCompare(b,"et"));
const DAYS = ["Esmaspäev","Teisipäev","Kolmapäev","Neljapäev","Reede","Laupäev","Pühapäev"];
const DS = ["E","T","K","N","R"];
const MON = ["jaanuar","veebruar","märts","aprill","mai","juuni","juuli","august","september","oktoober","november","detsember"];

// ---- date helpers (local time) ----
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d); x.setDate(x.getDate()+n); return x; };
const dow = d => (d.getDay()+6)%7;
const monday = d => addDays(new Date(d.getFullYear(),d.getMonth(),d.getDate()), -dow(d));
const mins = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const nice = d => `${d.getDate()}. ${MON[d.getMonth()]}`;
function weekOf(d){ return CAL.weeks[iso(monday(d))] || null; }
function lessonsOn(d){
  const k=iso(d), dw=dow(d);
  if (dw>4 || CAL.off[k]) return [];
  const w = weekOf(d);
  if (!w) return [];
  return TT.filter(l=>l[0]===dw && (l[2]===""||l[2]===w)).sort((a,b)=>a[1]-b[1])
    .map(l=>({p:l[1],subj:l[3],teacher:l[4],room:l[5],start:BELLS[l[1]][0],end:BELLS[l[1]][1]}));
}
function nextSchoolDay(from){
  for (let i=1;i<60;i++){ const d=addDays(from,i); if (lessonsOn(d).length) return d; }
  return null;
}
function relDay(d, today){
  const diff = Math.round((parse(iso(d))-parse(iso(today)))/864e5);
  if (diff===0) return "täna"; if (diff===1) return "homme"; if (diff===-1) return "eile";
  if (diff>1 && diff<7) return DAYS[dow(d)].toLowerCase();
  return nice(d);
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dot = s => `<span class="dot" style="background:${COLORS[s]||"#888"}"></span>`;

// ---- state ----
let tab = "today", weekOffset = 0, selDay = null, tasks = [], adding = false, form = {type:"Kodutöö",subj:"",what:"",due:""};
try { tab = localStorage.getItem("tab") || "today"; } catch(e){}

// ---- storage: db when available, else this browser only ----
let db = null;
const LS = "tasks-local";
function loadLocal(){ try { tasks = JSON.parse(localStorage.getItem(LS)||"[]"); } catch(e){ tasks=[]; } }
function saveLocal(){ try { localStorage.setItem(LS, JSON.stringify(tasks)); } catch(e){} }
loadLocal();
(async () => {
  if (!window.claude?.use) return;
  db = await window.claude.use("db");
  if (!db) return;
  db.collection("tasks").onSnapshot(snap => {
    tasks = snap.docs.map(d=>({id:d.id,...d.data()}));
    render();
  }, () => { db = null; });
})();
async function saveTask(t){
  if (db) { try { await db.collection("tasks").doc(t.id).set({type:t.type,subj:t.subj,what:t.what,due:t.due,done:!!t.done,created:t.created}); return; } catch(e){} }
  const i = tasks.findIndex(x=>x.id===t.id); if (i<0) tasks.push(t); else tasks[i]=t; saveLocal(); render();
}
async function removeTask(id){
  if (db) { try { await db.collection("tasks").doc(id).delete(); return; } catch(e){} }
  tasks = tasks.filter(t=>t.id!==id); saveLocal(); render();
}
function nextLessonDate(subj){
  const now = new Date();
  for (let i=1;i<60;i++){ const d=addDays(now,i); if (lessonsOn(d).some(l=>l.subj===subj)) return iso(d); }
  return iso(addDays(now,1));
}

// ---- views ----
function lessonRow(l, state){
  return `<div class="lesson ${state||""}"><div class="t tnum"><b>${l.start}</b>${l.end}</div>
    <div class="n">${dot(l.subj)}${esc(l.subj)}<small>${esc(l.teacher)}</small></div><div class="rm">${esc(l.room)}</div></div>`;
}
function dueTasks(dateIso){ return tasks.filter(t=>!t.done && t.due===dateIso); }
function taskMini(list, when){
  if (!list.length) return "";
  return `<div class="label">Esita ${when}</div><div class="stack">${list.map(t=>`<div class="lesson" style="grid-template-columns:1fr"><div class="n">${dot(t.subj)}${esc(t.subj)}${t.type==="Kontrolltöö"?'<span class="tag">KT</span>':""}<small>${esc(t.what)}</small></div></div>`).join("")}</div>`;
}

function viewToday(){
  const now = new Date(), t = now.getHours()*60+now.getMinutes();
  const L = lessonsOn(now), w = weekOf(now), k = iso(now);
  let h = `<div class="head"><div><h1>${DAYS[dow(now)]}</h1><div class="sub">${nice(now)}</div></div>${w?`<span class="wk">${w}-nädal</span>`:""}</div>`;
  if (CAL.notes[k]) h += `<div class="note" style="margin-bottom:12px">${esc(CAL.notes[k])}</div>`;

  const cur = L.find(l=>t>=mins(l.start)&&t<mins(l.end));
  const next = L.find(l=>mins(l.start)>t);
  if (cur){
    const left = mins(cur.end)-t, pct = Math.round((t-mins(cur.start))/(mins(cur.end)-mins(cur.start))*100);
    h += `<div class="now"><div class="k">Praegu · lõpeb ${cur.end}</div><div class="s">${esc(cur.subj)}</div>
      <div class="row"><div class="r">${esc(cur.teacher)}</div><div class="room">${esc(cur.room)}</div></div>
      <div class="bar"><i style="width:${pct}%"></i></div><div class="k tnum" style="margin-top:8px">veel ${left} min</div></div>`;
    if (next) h += `<div class="label">Järgmisena</div>${lessonRow(next)}`;
  } else if (next){
    const inMin = mins(next.start)-t;
    const when = inMin<=60 ? `algab ${inMin} min pärast` : `algab ${next.start}`;
    h += `<div class="now"><div class="k">${L[0]===next?"Esimene tund":"Järgmine tund"} · ${when}</div><div class="s">${esc(next.subj)}</div>
      <div class="row"><div class="r">${esc(next.teacher)} · ${next.start}</div><div class="room">${esc(next.room)}</div></div></div>`;
  } else {
    const nd = nextSchoolDay(now);
    const reason = CAL.off[k] ? CAL.off[k] : dow(now)>4 ? "Nädalavahetus" : L.length ? "Koolipäev on läbi" : "Täna tunde pole";
    h += `<div class="calm"><div class="k">${esc(reason)}</div>`;
    if (nd){ const f = lessonsOn(nd)[0];
      h += `<div class="s">${relDay(nd,now).replace(/^./,c=>c.toUpperCase())} ${f.start} · ${esc(f.subj)}</div><div class="k">Klass ${esc(f.room)}</div>`; }
    h += `</div>`;
    if (nd){ h += taskMini(dueTasks(iso(nd)), relDay(nd,now)); h += `<div class="label">${relDay(nd,now).replace(/^./,c=>c.toUpperCase())}</div><div class="stack">${lessonsOn(nd).map(l=>lessonRow(l)).join("")}</div>`; }
    return h;
  }
  h += taskMini(dueTasks(k), "täna");
  h += `<div class="label">Tänased tunnid</div><div class="stack">${L.map(l=>lessonRow(l, t>=mins(l.end)?"past":l===cur?"cur":"")).join("")}</div>`;
  const nd = nextSchoolDay(now);
  if (nd) h += taskMini(dueTasks(iso(nd)), relDay(nd,now));
  return h;
}

function viewWeek(){
  const now = new Date(), mon = addDays(monday(now), weekOffset*7), w = weekOf(mon);
  if (selDay===null) selDay = (weekOffset===0 && dow(now)<5) ? dow(now) : 0;
  const d = addDays(mon, selDay), L = lessonsOn(d), k = iso(d);
  const title = weekOffset===0?"See nädal":weekOffset===1?"Järgmine nädal":weekOffset===-1?"Eelmine nädal":`${nice(mon)}`;
  let h = `<div class="head"><div><h1>Tunniplaan</h1><div class="sub">9D</div></div></div>
  <div class="wnav"><button id="wprev" aria-label="Eelmine nädal">‹</button><div>${title}<small>${w?w+"-nädal · ":""}${nice(mon)} – ${nice(addDays(mon,4))}</small></div><button id="wnext" aria-label="Järgmine nädal">›</button></div>
  <div class="days">${DS.map((s,i)=>{const dd=addDays(mon,i);return `<button data-day="${i}" class="${i===selDay?"on":""} ${iso(dd)===iso(now)?"today":""}"><span>${s}</span><b>${dd.getDate()}</b></button>`}).join("")}</div>`;
  if (CAL.notes[k]) h += `<div class="note" style="margin-bottom:10px">${esc(CAL.notes[k])}</div>`;
  h += L.length ? `<div class="stack">${L.map(l=>lessonRow(l)).join("")}</div>`
       : `<div class="calm"><div class="s">${esc(CAL.off[k] || "Tunde pole")}</div></div>`;
  const due = tasks.filter(t=>!t.done && t.due===k);
  if (due.length) h += taskMini(due, relDay(d,now));
  return h;
}

function viewTasks(){
  const now = new Date(), today = iso(now);
  let h = `<div class="head"><div><h1>Ülesanded</h1><div class="sub">Kodutööd ja kontrolltööd</div></div></div>`;
  if (adding){
    h += `<form class="add" id="addform">
      <div class="seg"><button type="button" data-type="Kodutöö" class="${form.type==="Kodutöö"?"on":""}">Kodutöö</button><button type="button" data-type="Kontrolltöö" class="${form.type==="Kontrolltöö"?"on":""}">Kontrolltöö</button></div>
      <select id="f-subj" aria-label="Aine"><option value="">Vali aine…</option>${SUBJECTS.map(s=>`<option ${s===form.subj?"selected":""}>${s}</option>`).join("")}</select>
      <input id="f-what" placeholder="${form.type==="Kontrolltöö"?"Mis teema?":"Mida teha? nt lk 42 ül 3–5"}" value="${esc(form.what)}" autocomplete="off">
      <input id="f-due" type="date" value="${form.due}" aria-label="Tähtaeg">
      <div class="hint">${form.subj?"Tähtajaks pandi järgmine "+esc(form.subj.toLowerCase())+" tund":"Tähtaeg täitub ise, kui valid aine"}</div>
      <div class="row2"><button type="button" class="ghost" id="f-cancel">Tühista</button><button class="big-btn" type="submit">Lisa</button></div>
    </form>`;
  } else {
    h += `<button class="big-btn" id="addbtn">+ Lisa ülesanne</button>`;
  }
  const open = tasks.filter(t=>!t.done).sort((a,b)=>a.due.localeCompare(b.due));
  const done = tasks.filter(t=>t.done).sort((a,b)=>b.due.localeCompare(a.due)).slice(0,10);
  const row = t => {
    const d = parse(t.due), late = t.due<today, soon = t.due<=iso(addDays(now,1));
    return `<div class="task ${t.done?"done":""}"><button class="chk" data-done="${t.id}" aria-label="Märgi tehtuks">${t.done?"✓":""}</button>
      <div class="body"><div class="what">${esc(t.what||t.type)}</div><div class="meta">${dot(t.subj)}${esc(t.subj)}${t.type==="Kontrolltöö"?'<span class="tag">KT</span>':""} · <span class="${!t.done&&(soon||late)?"due-soon":""}">${late&&!t.done?"hilinenud · ":""}${relDay(d,now)}</span></div></div>
      <button class="del" data-del="${t.id}" aria-label="Kustuta">×</button></div>`;
  };
  h += `<div class="label">Teha</div>`;
  h += open.length ? `<div class="stack">${open.map(row).join("")}</div>` : `<div class="empty">Kõik tehtud 🎉<br>Uue kodutöö lisamiseks vajuta ülal olevat nuppu.</div>`;
  if (done.length) h += `<div class="label">Tehtud</div><div class="stack">${done.map(row).join("")}</div>`;
  return h;
}

function render(){
  const app = document.getElementById("app");
  const focusId = document.activeElement?.id;
  app.innerHTML = tab==="today"?viewToday():tab==="week"?viewWeek():viewTasks();
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const tomorrow = iso(addDays(new Date(),1));
  const urgent = tasks.filter(t=>!t.done && t.due<=tomorrow).length;
  const badge = document.getElementById("badge"); badge.hidden = !urgent; badge.textContent = urgent;
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}

document.querySelector("nav.tabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; if (tab==="week"){ weekOffset=0; selDay=null; }
  try { localStorage.setItem("tab", tab); } catch(e){}
  render(); window.scrollTo(0,0);
});
document.getElementById("app").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  if (b.id==="wprev"){ weekOffset--; selDay=0; render(); }
  else if (b.id==="wnext"){ weekOffset++; selDay=0; render(); }
  else if (b.dataset.day){ selDay=+b.dataset.day; render(); }
  else if (b.id==="addbtn"){ adding=true; form={type:"Kodutöö",subj:"",what:"",due:iso(addDays(new Date(),1))}; render(); document.getElementById("f-subj").focus(); }
  else if (b.id==="f-cancel"){ adding=false; render(); }
  else if (b.dataset.type){ form.type=b.dataset.type; render(); }
  else if (b.dataset.done){ const t=tasks.find(x=>x.id===b.dataset.done); if (t) saveTask({...t,done:!t.done}); }
  else if (b.dataset.del){ removeTask(b.dataset.del); }
});
document.getElementById("app").addEventListener("input", e=>{
  if (e.target.id==="f-what") form.what=e.target.value;
  if (e.target.id==="f-due") form.due=e.target.value;
});
document.getElementById("app").addEventListener("change", e=>{
  if (e.target.id==="f-subj"){ form.subj=e.target.value; if (form.subj) form.due=nextLessonDate(form.subj); render(); }
  if (e.target.id==="f-due") form.due=e.target.value;
});
document.getElementById("app").addEventListener("submit", e=>{
  e.preventDefault();
  if (!form.subj){ document.getElementById("f-subj").focus(); return; }
  const t = {id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), type:form.type, subj:form.subj, what:form.what.trim(), due:form.due||iso(addDays(new Date(),1)), done:false, created:Date.now()};
  adding=false; saveTask(t); render();
});
render();
setInterval(()=>{ if (tab!=="tasks" || !adding) render(); }, 30000);
</script>
</body></html>
