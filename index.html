<!doctype html><html lang="et"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Kool">
<link rel="apple-touch-icon" href="icon.png"><meta name="theme-color" content="#f4efe8">
<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}[hidden]{display:none!important}</style>
<script>
const APP_V="1791437242";
async function checkUpdate(){try{const r=await fetch("version.txt?"+Date.now(),{cache:"no-store"});const v=(await r.text()).trim();
 if(v&&v!==APP_V&&sessionStorage.getItem("tried")!==v){sessionStorage.setItem("tried",v);location.replace(location.pathname+"?v="+v);}}catch(e){}}
checkUpdate();document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkUpdate();});
["gesturestart","gesturechange"].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener("touchmove",e=>{if(e.touches.length>1)e.preventDefault();},{passive:false});
</script>
<title>Minu Koolipäev</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Onest:wght@400;500;600;700&display=swap">
<style>
/* Layout: one thumb-width column. The hero card wears the colour of the subject you're in right now; everything else stays quiet. Floating tab pill at the bottom. */
:root{
  --bg:#f4efe8; --card:#fbf8f3; --fg:#2e2824; --muted:#8f847a; --line:#e6ded3;
  --accent:#8b6f5a; --soft:#ece3d8; --warn:#b5654a; --warn-soft:#f3e2d9; --good:#7d9a7e;
  --glass:rgba(251,248,243,.84); --shadow:0 12px 30px -16px rgba(80,60,40,.28); color-scheme:light;
  --display:"Fraunces",Georgia,serif;
  --body:"Onest",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%;overscroll-behavior:none}
html{-webkit-text-size-adjust:100%}
html,body,*{touch-action:pan-x pan-y}
button,nav,.lesson,.hero,.next,.tile,.days,.chip,h1,.hello,.label{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-font-smoothing:antialiased}
main{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:18px calc(110px + env(safe-area-inset-bottom,0px))}
.tnum{font-variant-numeric:tabular-nums}
h1{font-family:var(--display);font-size:32px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:0;text-wrap:balance}
.hello{color:var(--muted);font-weight:500;font-size:15px;margin-bottom:4px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
.chip{font-size:13px;font-weight:700;color:var(--accent);background:var(--soft);padding:6px 11px;border-radius:99px;white-space:nowrap}
.label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:24px 2px 10px;display:flex;justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:8px}
.in{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{transform:translateY(8px);opacity:.001}}

/* day strip */
.strip{display:flex;gap:5px;margin-bottom:14px}
.strip i{flex:1;height:7px;border-radius:9px;background:var(--line);position:relative;overflow:hidden}
.strip i.done{background:var(--c)}
.strip i.cur{background:color-mix(in srgb,var(--c) 30%,var(--line))}
.strip i.cur b{position:absolute;inset:0 auto 0 0;background:var(--c);border-radius:9px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px;color:#fff;
  background:linear-gradient(140deg,var(--c) 0%,color-mix(in srgb,var(--c) 62%,#000) 100%);box-shadow:0 18px 40px -18px var(--c)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero .k{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.85;display:flex;align-items:center;gap:7px}
.live{width:8px;height:8px;border-radius:50%;background:#fff;box-shadow:0 0 0 0 rgba(255,255,255,.7)}
@media (prefers-reduced-motion:no-preference){.live{animation:pulse 1.8s infinite}}
@keyframes pulse{70%{box-shadow:0 0 0 9px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hero .s{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.03em;line-height:1.05;margin:10px 0 0;position:relative;z-index:1}
.hero .t{font-size:16px;font-weight:500;opacity:.9;margin-top:4px}
.hero .bottom{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:22px;position:relative;z-index:1}
.hero .room{font-family:var(--display);font-size:52px;font-weight:800;letter-spacing:-.04em;line-height:.85}
.hero .room small{display:block;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.8;margin-bottom:6px}
.hero .left{text-align:right}
.hero .left b{font-family:var(--display);font-size:40px;font-weight:800;letter-spacing:-.03em;line-height:.9}
.hero .left span{display:block;font-size:13px;font-weight:600;opacity:.85;margin-top:4px}
.hero .bar{height:6px;background:rgba(255,255,255,.25);border-radius:9px;margin-top:18px;overflow:hidden;position:relative;z-index:1}
.hero .bar i{display:block;height:100%;background:#fff;border-radius:9px}
.hero.free{--c:#12b886}

/* next + tiles */
.next{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:14px 16px;margin-top:10px}
.next .ic{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 24%,var(--card))}
.next .n{flex:1;min-width:0}
.next .n small{display:block;color:var(--muted);font-size:13px}
.next .n b{font-weight:700}
.next .rm{font-family:var(--display);font-weight:800;font-size:22px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{background:var(--card);border-radius:20px;padding:14px 16px}
.tile small{display:block;color:var(--muted);font-size:13px;font-weight:500}
.tile b{display:block;font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
.tile span{font-size:13px;color:var(--muted)}

/* lessons */
.lesson{display:grid;grid-template-columns:50px 1fr auto;gap:12px;align-items:center;border-radius:18px;padding:12px 14px;
  background:color-mix(in srgb,var(--c) 16%,var(--card))}
.lesson .time{font-size:13px;color:var(--muted);line-height:1.3}
.lesson .time b{display:block;color:var(--fg);font-size:15px}
.lesson .n{font-weight:700;min-width:0;display:flex;align-items:center;gap:9px}
.lesson .n small{display:block;color:var(--muted);font-weight:400;font-size:13px}
.lesson .rm{font-family:var(--display);font-weight:800;font-size:18px;color:color-mix(in srgb,var(--c) 75%,var(--fg))}
.lesson.past{opacity:.4}
.lesson.cur{box-shadow:inset 0 0 0 2px var(--c)}
.sw{flex:none;width:10px;height:10px;border-radius:4px;background:var(--c)}
.note{background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:14px;border-radius:16px;padding:12px 16px;margin-bottom:12px}

/* week */
.wnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.wnav button,.round{font:inherit;font-size:22px;border:0;background:var(--card);color:var(--fg);width:44px;height:44px;border-radius:50%;cursor:pointer;flex:none}
.wnav div{font-weight:700;text-align:center}
.wnav div small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.days button{font:inherit;border:0;background:var(--card);color:var(--fg);border-radius:16px;padding:10px 0 8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.days button span{font-size:12px;color:var(--muted);font-weight:600}
.days button b{font-family:var(--display);font-size:20px;font-weight:800}
.days button em{display:flex;gap:2px;height:5px}
.days button em i{width:5px;height:5px;border-radius:50%;background:var(--c)}
.days button.on{background:var(--fg);color:var(--bg)}
.days button.on span{color:var(--bg);opacity:.7}
.days button.today:not(.on){box-shadow:inset 0 0 0 2px var(--accent)}
.empty-day{background:var(--card);border-radius:22px;padding:28px 20px;text-align:center}
.empty-day b{font-family:var(--display);font-size:24px;font-weight:800;display:block}
.empty-day span{color:var(--muted)}

/* tasks */
.task{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:18px;padding:13px 14px}
.chk{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid color-mix(in srgb,var(--c) 60%,var(--line));background:none;cursor:pointer;display:grid;place-items:center;color:#fff;padding:0}
.chk svg{width:16px;height:16px;stroke:#fff;stroke-width:3.2;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task.done .chk{background:var(--good);border-color:var(--good)}
.task.done .chk svg{opacity:1}
.task.pop .chk{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.25)}}
.task .body{flex:1;min-width:0}
.task .what{font-weight:600;overflow-wrap:anywhere}
.task .meta{font-size:13px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.task.done .what{text-decoration:line-through;color:var(--muted)}
.task .del{border:0;background:none;color:var(--muted);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
.kt{font-size:11px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:7px;background:var(--warn-soft);color:var(--warn)}
.soon{color:var(--warn);font-weight:700}
.fab{width:100%;font:inherit;font-weight:700;font-size:17px;border:0;border-radius:20px;padding:16px;background:var(--fg);color:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.fab span{font-size:24px;line-height:0}
.party{text-align:center;padding:30px 16px;background:var(--card);border-radius:24px}
.party b{font-family:var(--display);font-size:26px;font-weight:800;display:block;margin:6px 0 4px}
.party span{color:var(--muted)}
.party .big{font-size:44px}
form.add{background:var(--card);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
form.add input{font:inherit;font-size:16px;width:100%;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:13px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:14px}
.seg button{font:inherit;font-weight:700;border:0;background:none;color:var(--muted);border-radius:11px;padding:10px;cursor:pointer}
.seg button.on{background:var(--card);color:var(--fg);box-shadow:0 2px 8px -2px rgba(0,0,0,.15)}
.subjects{display:flex;flex-wrap:wrap;gap:6px}
.subjects button{font:inherit;font-size:14px;font-weight:600;border:0;border-radius:99px;padding:8px 12px;cursor:pointer;color:var(--fg);background:color-mix(in srgb,var(--c) 22%,var(--card))}
.subjects button.on{background:var(--c);color:#fff}
.hint{font-size:13px;color:var(--muted)}
.row2{display:flex;gap:8px}
.row2 button{flex:1}
.ghost{font:inherit;font-weight:700;border:0;background:var(--bg);color:var(--muted);border-radius:16px;padding:14px;cursor:pointer}
.go{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:16px;padding:14px;background:var(--accent);color:#fff;cursor:pointer}
.go:disabled{opacity:.4}

/* subjects */
.exam{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 14px;cursor:pointer;border:0;font:inherit;color:inherit;text-align:left;width:100%}
.exam .when{flex:none;width:66px;text-align:center;border-radius:12px;padding:7px 6px;background:color-mix(in srgb,var(--c) 22%,var(--card));color:color-mix(in srgb,var(--c) 80%,var(--fg))}
.exam .when b{display:block;font-family:var(--display);font-size:20px;font-weight:800;line-height:1}
.exam .when b.w{font-size:16px;line-height:20px}
.exam .when span{font-size:10px;font-weight:700}
.exam .when.hot{background:var(--warn);color:#fff}
.exam .body{flex:1;min-width:0}
.exam .body b{display:block;font-weight:700}
.exam .body small{color:var(--muted);font-size:13px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.scard{font:inherit;color:inherit;text-align:left;border:0;cursor:pointer;border-radius:20px;padding:14px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
  background:color-mix(in srgb,var(--c) 20%,var(--card));position:relative}
.scard b{font-family:var(--display);font-size:18px;font-weight:800;letter-spacing:-.01em;color:color-mix(in srgb,var(--c) 70%,var(--fg))}
.scard small{font-size:13px;color:var(--muted);line-height:1.3}
.scard .kt{position:absolute;top:12px;right:12px}
.back{font:inherit;font-weight:700;border:0;background:var(--card);color:var(--fg);border-radius:99px;padding:9px 15px 9px 11px;cursor:pointer;margin-bottom:14px}
.shero{border-radius:26px;padding:20px;color:#fff;background:linear-gradient(140deg,var(--c) 0%,color-mix(in srgb,var(--c) 62%,#000) 100%);box-shadow:0 18px 40px -18px var(--c)}
.shero .k{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;opacity:.85}
.shero h1{color:#fff;margin-top:4px}
.shero p{margin:10px 0 0;font-weight:600;font-size:17px;opacity:.95}
.card{background:var(--card);border-radius:20px;padding:16px}
.card ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:9px;line-height:1.45}
.card .sub{color:var(--muted);font-size:14px;margin-top:4px}
.ktcard{background:var(--warn-soft);border-radius:18px;padding:14px 16px}
.ktcard b{color:var(--warn)}
.ktcard div{font-size:14px;margin-top:4px}
.terms{display:flex;flex-direction:column;gap:6px}
.term{border:0;font:inherit;color:inherit;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;cursor:pointer;width:100%}
.term b{font-weight:700}
.term span{display:block;color:var(--muted);font-size:14px;margin-top:3px}
.term .tap{display:inline;color:var(--accent);font-size:13px;font-weight:600;margin-left:6px}
.q{background:var(--card);border-radius:20px;padding:16px}
.q .qq{font-weight:700;margin-bottom:10px;line-height:1.4}
.q .opts{display:flex;flex-direction:column;gap:6px}
.q .opts button{font:inherit;text-align:left;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:14px;padding:11px 13px;cursor:pointer}
.q .opts button.ok{background:var(--good);border-color:var(--good);color:#fff}
.q .opts button.bad{background:var(--warn);border-color:var(--warn);color:#fff}
.q .opts button:disabled{cursor:default}
.q .opts button:disabled:not(.ok):not(.bad){opacity:.5}
.score{text-align:center;font-weight:700;padding:14px;border-radius:18px;background:var(--soft);color:var(--accent)}

/* floating tab pill */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100% - 32px));
  background:var(--glass);-webkit-backdrop-filter:blur(18px) saturate(1.6);backdrop-filter:blur(18px) saturate(1.6);
  border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);display:flex;padding:6px}
nav.tabs button{flex:1;font:inherit;font-size:11px;font-weight:700;border:0;background:none;color:var(--muted);padding:8px 0 7px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:20px;position:relative}
nav.tabs button.on{color:var(--fg);background:var(--card)}
nav.tabs svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}
nav.tabs .badge{position:absolute;top:3px;left:calc(50% + 7px);background:var(--warn);color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
button:focus-visible,input:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.in,.task.pop .chk{animation:none}}
.ai{display:grid;gap:8px;margin-top:12px}
.ai a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);background:var(--card);border-radius:18px;padding:14px 16px;font-weight:700;box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--c) 35%,var(--line))}
.ai a span{flex:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:18px;background:color-mix(in srgb,var(--c) 24%,var(--card))}
.ai a small{display:block;font-weight:500;color:var(--muted);font-size:13px}
.ai a:active{transform:scale(.98)}
.photo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff;border-radius:20px;padding:15px 16px;font-weight:700;margin-top:10px;
  background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 60%,#000))}
.photo span{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:19px;background:rgba(255,255,255,.18)}
.photo small{display:block;font-weight:500;opacity:.85;font-size:13px}
.ai .photo{margin-top:0}

/* soft beige theme: pastel tints with dark espresso text instead of saturated colour blocks */
h1,.hero .s,.hero .room,.hero .left b,.next .rm,.tile b,.lesson .rm,.days button b,.empty-day b,.party b,.exam .when b,.scard b,.shero h1{font-weight:600;letter-spacing:-.01em}
h1{font-size:34px}
.hero,.shero{color:var(--fg);background:color-mix(in srgb,var(--c) 36%,var(--card));box-shadow:var(--shadow)}
.hero::after{background:color-mix(in srgb,var(--c) 22%,transparent)}
.hero .k,.shero .k{opacity:1;color:color-mix(in srgb,var(--c) 55%,var(--fg))}
.hero .room{color:color-mix(in srgb,var(--c) 55%,var(--fg))}
.hero .bar{background:rgba(46,40,36,.09)}
.hero .bar i{background:color-mix(in srgb,var(--c) 70%,var(--fg))}
.live{background:color-mix(in srgb,var(--c) 70%,var(--fg));box-shadow:none}
.hero.free{--c:#94a678}
.shero h1{color:var(--fg)}
.photo{color:var(--card);background:var(--fg)}
.photo span{background:rgba(255,255,255,.12)}
.subjects button.on{background:color-mix(in srgb,var(--c) 75%,#2e2824);color:#fff}
.chip{color:var(--accent);background:var(--soft)}
.fab{background:var(--fg);color:var(--card)}
.days button.on{background:var(--fg);color:var(--card)}
.days button.on span{color:var(--card)}
.task,.next,.tile,.card,.empty-day,.party,.days button,.wnav button{box-shadow:0 1px 0 var(--line)}
nav.tabs button.on{color:var(--fg);background:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip.fire{color:#b5654a;background:#f6e3d6}
.chg{display:block;font-style:normal;font-size:12px;font-weight:700;color:var(--warn);margin-top:2px}
.hero .t .chg{display:inline;font-size:inherit}
.lesson.cancel{opacity:.55}
.src{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--soft);color:var(--accent)}
.ktbanner{width:100%;display:flex;align-items:center;gap:12px;font:inherit;text-align:left;border:0;cursor:pointer;color:var(--fg);border-radius:20px;padding:14px 16px;margin-bottom:12px;background:var(--warn-soft)}
.ktbanner span{font-size:22px}
.ktbanner div{flex:1;min-width:0}
.ktbanner small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ktbanner em{font-style:normal;font-weight:700;font-size:13px;color:var(--warn);white-space:nowrap}
.flash{width:100%;min-height:260px;font:inherit;border:0;cursor:pointer;border-radius:28px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:var(--fg);background:color-mix(in srgb,var(--c) 32%,var(--card));box-shadow:var(--shadow);margin-bottom:12px}
.flash small{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 55%,var(--fg))}
.flash b{font-family:var(--display);font-size:30px;font-weight:600;line-height:1.15}
.flash.flip b{font-family:var(--body);font-size:19px;font-weight:500;line-height:1.45}
.flash em{font-style:normal;color:var(--muted);font-size:13px}
@media (prefers-reduced-motion:no-preference){.flash{transition:transform .2s}.flash:active{transform:scale(.98)}}
.row2 .ghost{background:var(--card)}
.fcbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin-bottom:12px}
.fcbar i{display:block;height:100%;background:color-mix(in srgb,var(--c) 70%,var(--fg));border-radius:9px}
.lunch{width:100%;font:inherit;text-align:left;border:0;cursor:pointer;color:var(--fg);background:var(--card);border-radius:20px;padding:14px 16px;margin-top:10px;box-shadow:0 1px 0 var(--line);display:block}
.lhead{display:flex;align-items:center;gap:12px}
.lic{flex:none;width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;background:linear-gradient(135deg,#fde2c4,#f9d0d6)}
.lmain{flex:1;min-width:0}
.lmain small{display:block;color:var(--muted);font-size:13px}
.lmain b{display:block;font-weight:700}
.lmain i{display:block;font-style:normal;color:#6f8a62;font-size:14px;margin-top:2px}
.chev{font-style:normal;color:var(--muted);font-size:22px;line-height:1;transition:transform .3s}
.lunch.open .chev{transform:rotate(90deg)}
.lmore{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.lunch.open .lmore{grid-template-rows:1fr}
.lmore>div{overflow:hidden}
.lmore p{margin:10px 0 0 52px;color:var(--muted);font-size:14px;line-height:1.45}
.news{display:flex;flex-direction:column;gap:8px}
.news a{display:block;text-decoration:none;color:var(--fg);background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:0 1px 0 var(--line)}
.news small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.news b{font-weight:600;font-size:15px}
/* motion: staggered entry on tab change, sliding tab pill, card flips, press feedback */
nav.tabs .pill{position:absolute;top:6px;bottom:6px;left:0;width:0;border-radius:20px;background:var(--soft);z-index:0}
nav.tabs button{z-index:1}
nav.tabs button.on{background:none}
.task,.scard,.exam,.ktbanner,.lunch,.fab,.go,.ghost,.next,.news a,.ai a,.photo,.days button{transition:transform .15s ease}
.task:active,.scard:active,.exam:active,.ktbanner:active,.lunch:active,.fab:active,.go:active,.ghost:active,.news a:active,.ai a:active,.photo:active,.days button:active{transform:scale(.975)}

  .stagger>*:nth-child(2){animation-delay:.04s}.stagger>*:nth-child(3){animation-delay:.08s}.stagger>*:nth-child(4){animation-delay:.12s}
  .stagger>*:nth-child(5){animation-delay:.16s}.stagger>*:nth-child(6){animation-delay:.2s}.stagger>*:nth-child(7){animation-delay:.24s}
  .stagger>*:nth-child(n+8){animation-delay:.28s}

  .flash.fx-next{animation:slidein .4s cubic-bezier(.2,.8,.2,1)}
  @keyframes flipin{from{transform:perspective(900px) rotateY(-80deg);opacity:.4}}
  @keyframes slidein{from{transform:translateX(40px) rotate(2deg);opacity:0}}
  .chk.pop{animation:pop .35s}
}

// ---- date helpers (local time) ----
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; };
const dow = d => (d.getDay()+6)%7;
const monday = d => addDays(d, -dow(d));
const mins = hm => { const [h,m]=hm.split(":").map(Number); return h*60+m; };
const nice = d => `${d.getDate()}. ${MON[d.getMonth()]}`;

const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
const dur = m => m<60 ? `${m} min` : `${Math.floor(m/60)} h ${m%60} min`;
const weekOf = d => CAL.weeks[iso(monday(d))] || null;
function bakedOn(d){
  const k=iso(d), dw=dow(d);
  if (dw>4 || CAL.off[k]) return [];
  const w = weekOf(d); if (!w) return [];
  return TT.filter(l=>l[0]===dw && (l[2]===""||l[2]===w)).sort((a,b)=>a[1]-b[1])
    .map(l=>({p:l[1],subj:l[3],teacher:l[4],room:l[5],start:BELLS[l[1]][0],end:BELLS[l[1]][1]}));
}
// live.json (Edupage, refreshed by a GitHub Action) wins over the baked timetable for the days it covers
let LIVE = null;
function lessonsOn(d){
  const k = iso(d), base = bakedOn(d), live = LIVE && LIVE.days && LIVE.days[k];
  if (!live || CAL.off[k]) return base;
  return live.map(l=>{
    const b = base.find(x=>x.p===l.p);
    let change = "";
    if (!b) change = "Lisatund";
    else if (b.subj!==l.subj) change = `Asendus (${b.subj} asemel)`;
    else {
      const parts = [];
      if (l.room && l.room!==b.room) parts.push(`klass ${b.room} → ${l.room}`);
      if (l.teacher && l.teacher!==b.teacher) parts.push(`õpetaja ${l.teacher}`);
      change = cap(parts.join(", "));
    }
    return {...l, room: l.room || (b && b.room) || "", change};
  });
}
function cancelledOn(d){
  const k = iso(d), live = LIVE && LIVE.days && LIVE.days[k];

  return bakedOn(d).filter(b=>!live.some(l=>l.p===b.p)).map(b=>({...b, cancelled:true}));
}

function relDay(d, today){
  const diff = dayDiff(d,today);
  if (diff===0) return "täna"; if (diff===1) return "homme"; if (diff===2) return "ülehomme"; if (diff===-1) return "eile";

function hashId(s){ let h=0; for (const c of s) h=(h*31+c.charCodeAt(0))|0; return "s"+(h>>>0).toString(36); }
function autoTasks(){
  if (typeof ED==="undefined") return [];
  const out = [], from = iso(addDays(new Date(),-1));
  for (const [s,d] of Object.entries(ED)){
    for (const [due,what] of (d.hw||[])) out.push({id:hashId(s+due+what), type:"Kodutöö", subj:s, what, due, auto:true});
    for (const [due,what] of (d.tests||[])) out.push({id:hashId(s+due+what), type:"Kontrolltöö", subj:s, what:what.replace(/^KT[^:]*:\s*/,""), due, auto:true});
  }
  return out.filter(t=>t.due>=from && autoState[t.id]!=="hidden").map(t=>({...t, done:autoState[t.id]==="done"}));
}
const allTasks = () => tasks.concat(autoTasks());

// ---- study streak: a day counts when a quiz or the word cards are finished; weekends don't break it ----
function studyDays(){ try { return JSON.parse(localStorage.getItem("study-days")||"[]"); } catch(e){ return []; } }
function markStudied(){
  const k = iso(new Date()), s = studyDays();
  if (!s.includes(k)){ s.push(k); try { localStorage.setItem("study-days", JSON.stringify(s.slice(-400))); } catch(e){} }
}
function streak(){
  const s = new Set(studyDays()); let d = new Date(), n = 0;
  if (!s.has(iso(d))) d = addDays(d,-1);
  for (let i=0;i<400;i++){ if (s.has(iso(d))) n++; else if (dow(d)<5) break; d = addDays(d,-1); }
  return n;
}

    h += tests.map(([due,what,note])=>`<div class="ktcard"><b>${esc(what)}</b> · ${relDay(parse(due),now)}${note?`<div>${esc(note)}</div>`:""}</div>`).join("");
    h += hw.map(([due,what])=>`<div class="card"><b>Kodutöö</b> · ${relDay(parse(due),now)}<div class="sub">${esc(what)}</div></div>`).join("");
    h += `</div>`;
  }
  if (d.simple) h += `<div class="label"><span>Lihtsalt öeldes</span></div><div class="card"><ul>${d.simple.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if (d.terms) h += `<div class="label"><span>Tähtsad sõnad</span><span>puuduta</span></div><button class="fab" id="fcstart" style="margin-bottom:10px"><span>🃏</span> Harjuta kaartidega</button><div class="terms">${d.terms.map(([t,def],i)=>{const k=s+i, o=openTerms.has(k);
    return `<button class="term" data-term="${esc(k)}"><b>${esc(t)}</b>${o?`<span>${esc(def)}</span>`:`<em class="tap">?</em>`}</button>`}).join("")}</div>`;
  if (d.quiz){
    const a = answers[s]||{}, done = Object.keys(a).length, right = d.quiz.filter((q,i)=>a[i]===q[2]).length;
    h += `<div class="label"><span>Harjuta</span><span>${done}/${d.quiz.length}</span></div><div class="stack">${d.quiz.map(([q,opts,ok],i)=>`<div class="q"><div class="qq">${i+1}. ${esc(q)}</div><div class="opts">${opts.map((o,j)=>{
      const cls = a[i]===undefined?"":j===ok?"ok":j===a[i]?"bad":"";
      return `<button data-q="${i}" data-a="${j}" class="${cls}" ${a[i]!==undefined?"disabled":""}>${esc(o)}</button>`}).join("")}</div></div>`).join("")}`;
    if (done===d.quiz.length) h += `<div class="score">${right}/${d.quiz.length} õigesti ${right===d.quiz.length?"🏆":right>=d.quiz.length/2?"👍":"💪"}</div><button class="ghost" id="qreset">Proovi uuesti</button>`;
    h += `</div>`;
  }
  return h;
}

function render(){
  const app = document.getElementById("app"), focusId = document.activeElement?.id;
  app.innerHTML = tab==="today"?viewToday():tab==="week"?viewWeek():tab==="subj"?viewSubjects():viewTasks();
  if (animate){ app.classList.remove("stagger"); void app.offsetWidth; app.classList.add("stagger"); clearTimeout(render.st); render.st = setTimeout(()=>app.classList.remove("stagger"), 900); }
  animate = false; popId = null; fx = "";
  document.querySelectorAll("nav.tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  const on = document.querySelector("nav.tabs button.on"), pill = document.querySelector("nav.tabs .pill");
  if (on && pill){ pill.style.width = on.offsetWidth+"px"; pill.style.transform = `translateX(${on.offsetLeft}px)`; }
  const urgent = openTasks().filter(t=>t.due<=iso(addDays(new Date(),1))).length;
  const badge = document.getElementById("badge"); badge.hidden = !urgent; badge.textContent = urgent;
  if (focusId && document.getElementById(focusId)) document.getElementById(focusId).focus();
}

document.querySelector("nav.tabs").addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  tab = b.dataset.tab; animate = true; if (tab==="week"){ weekOffset=0; selDay=null; } if (tab==="subj"){ subj=null; fc=null; }
  try { localStorage.setItem("tab", tab); } catch(e){}
  render(); window.scrollTo(0,0);
});
const app = document.getElementById("app");
app.addEventListener("click", e=>{
  const b = e.target.closest("button"); if (!b) return;
  if (b.id==="wprev"){ weekOffset--; selDay=0; render(); }
  else if (b.id==="wnext"){ weekOffset++; selDay=0; render(); }
  else if (b.dataset.day){ selDay=+b.dataset.day; render(); }
  else if (b.id==="addbtn"){ adding=true; form={type:"Kodutöö",subj:"",what:"",due:iso(addDays(new Date(),1))}; render(); }
  else if (b.id==="f-cancel"){ adding=false; render(); }
  else if (b.dataset.type){ form.type=b.dataset.type; render(); }
  else if (b.dataset.subj){ form.subj=b.dataset.subj; form.due=nextLessonDate(form.subj); render(); document.getElementById("f-what").focus(); }
  else if (b.dataset.done){
    const t = allTasks().find(x=>x.id===b.dataset.done); if (!t) return;
    popId = t.id;
    if (t.auto){ if (t.done) delete autoState[t.id]; else autoState[t.id]="done"; saveAuto(); render(); }
    else saveTask({...t,done:!t.done});
  }
  else if (b.dataset.del){
    const t = allTasks().find(x=>x.id===b.dataset.del);
    if (t && t.auto){ autoState[t.id]="hidden"; saveAuto(); render(); } else removeTask(b.dataset.del);
  }
  else if (b.id==="lunch"){ lunchOpen=!lunchOpen; b.classList.toggle("open", lunchOpen); }
  else if (b.id==="restore"){
    autoState = {}; saveAuto();
    for (const t of tasks.filter(x=>x.done)) saveTask({...t, done:false});
    render();
  }
  else if (b.dataset.subjGo){ tab="subj"; subj = ED[b.dataset.subjGo] ? b.dataset.subjGo : null; animate=true; render(); window.scrollTo(0,0); }
  else if (b.id==="fcstart"){ const n=ED[subj].terms.length; fc={s:subj, queue:[...Array(n).keys()].sort(()=>Math.random()-.5), flip:false, known:0, total:n}; render(); window.scrollTo(0,0); }
  else if (b.id==="fcflip"){ fc.flip=!fc.flip; fx="flip"; render(); }
  else if (b.id==="fcyes"){ fc.queue.shift(); fc.known++; fc.flip=false; fx="next"; if (!fc.queue.length) markStudied(); render(); }
  else if (b.id==="fcno"){ fc.queue.push(fc.queue.shift()); fc.flip=false; fx="next"; render(); }
  else if (b.id==="fcagain"){ fc.queue=[...Array(fc.total).keys()].sort(()=>Math.random()-.5); fc.known=0; fc.flip=false; render(); }
  else if (b.id==="fcclose"){ fc=null; render(); window.scrollTo(0,0); }
  else if (b.dataset.subjOpen){ subj=b.dataset.subjOpen; animate=true; render(); window.scrollTo(0,0); }
  else if (b.id==="sback"){ subj=null; render(); window.scrollTo(0,0); }
  else if (b.dataset.term){ const k=b.dataset.term; openTerms.has(k)?openTerms.delete(k):openTerms.add(k); render(); }
  else if (b.dataset.q){ const a=(answers[subj] ||= {}); a[b.dataset.q]=+b.dataset.a; if (Object.keys(a).length===ED[subj].quiz.length) markStudied(); render(); }
  else if (b.id==="qreset"){ answers[subj]={}; render(); }
});
app.addEventListener("input", e=>{ if (e.target.id==="f-what") form.what=e.target.value; });
app.addEventListener("change", e=>{ if (e.target.id==="f-due"){ form.due=e.target.value; render(); } });
app.addEventListener("submit", e=>{
  e.preventDefault(); if (!form.subj) return;
  const t = {id:"t"+Date.now().toString(36)+Math.random().toString(36).slice(2,6), type:form.type, subj:form.subj, what:form.what.trim(), due:form.due||iso(addDays(new Date(),1)), done:false, created:Date.now()};
  adding=false; saveTask(t); render();
});
document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && !adding){ animate=true; render(); loadLive(); } });
render();
loadLive(); setInterval(loadLive, 5*60000);
setInterval(()=>{ if (!adding) render(); }, 20000);
</script>
</body></html>
